<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/plain :: plain(~{::title}, ~{::main})}">
<head>
    <title>Вхід — Smart Home</title>
</head>
<body>
    <main>
        <section class="card auth-card">
            <h1>Вхід</h1>
            <div class="alert alert-error" th:if="${param.error}">
                Неправильна адреса електронної пошти або пароль.
            </div>
            <div class="alert alert-success" th:if="${param.logout}">
                Ви успішно вийшли з облікового запису.
            </div>
            <form th:action="@{/login}" method="post">
                <div class="field">
                    <label for="email">Електронна пошта</label>
                    <input id="email" name="email" type="email" autocomplete="username" required>
                </div>
                <div class="field">
                    <label for="password">Пароль</label>
                    <input id="password" name="password" type="password"
                           autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary">Увійти</button>
            </form>
        </section>
    </main>
</body>
</html>
