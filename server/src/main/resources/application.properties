spring.jackson.deserialization.fail-on-unknown-properties=true
spring.mvc.problem-details.enabled=true
spring.datasource.url=jdbc:h2:mem:smarthomedb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
smarthome.notifications.sender=smart-home
security.jwt.secret=${JWT_SECRET:dev-only-secret-key-change-me-0123456789}
security.jwt.expiration-minutes=15
spring.web.resources.chain.enabled=true
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
spring.web.resources.chain.cache=true
