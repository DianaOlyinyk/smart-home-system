plugins {
    id 'java'
}

allprojects {
    group = 'com.springbt.smarthome'
    version = '0.1.0-SNAPSHOT'
    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    java {
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }
    tasks.withType(Test) {
        useJUnitPlatform()
    }
    tasks.withType(JavaCompile) {
        options.fork = true
    }
}
